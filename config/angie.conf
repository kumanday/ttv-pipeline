# Angie configuration for HTTP/3 edge proxy
# This configuration provides HTTP/3 termination and proxying to the FastAPI application

# Main context
user nginx;
worker_processes auto;
error_log /var/log/angie/error.log warn;
pid /var/run/angie.pid;

# Events context
events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

# HTTP context
http {
    # Basic settings
    include /etc/angie/mime.types;
    default_type application/octet-stream;

    # Logging format
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'proto=$server_protocol rt=$request_time';

    access_log /var/log/angie/access.log main;

    # Performance settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=burst:10m rate=50r/s;

    # Connection upgrade mapping for WebSocket support
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # Upstream to FastAPI application with HTTP/3 support
    upstream api_backend {
        # Primary HTTP/3 upstream to Hypercorn QUIC port
        server api:8443 quic=on max_fails=3 fail_timeout=30s;
        # HTTP/2 fallback to regular port
        server api:8000 backup max_fails=3 fail_timeout=30s;
        keepalive 32;
        keepalive_requests 1000;
        keepalive_timeout 60s;
    }

    # HTTP/3 server block
    server {
        # Listen on both TCP and UDP for HTTP/3
        listen 443 ssl http2;
        listen 443 quic;

        server_name _;

        # SSL/TLS configuration for HTTP/3 edge termination
        ssl_certificate /etc/ssl/certs/cert.pem;
        ssl_certificate_key /etc/ssl/certs/key.pem;

        # Enhanced SSL settings for HTTP/3 and QUIC
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers off;

        # TLS 1.3 specific settings for optimal QUIC performance
        ssl_conf_command Ciphersuites TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256;
        ssl_conf_command Options PrioritizeChaCha;

        # SSL session settings for connection resumption
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets on;

        # OCSP stapling for certificate validation
        ssl_stapling on;
        ssl_stapling_verify on;
        ssl_trusted_certificate /etc/ssl/certs/cert.pem;

        # QUIC/HTTP3 specific settings
        quic_retry on;
        ssl_early_data on;

        # QUIC parameter tuning for optimal performance
        quic_max_concurrent_streams 128;
        quic_active_connection_id_limit 8;
        quic_max_ack_delay 25ms;
        quic_max_udp_payload_size 1472;

        # Connection migration support
        quic_host_key /etc/ssl/certs/quic_host.key;

        # Add Alt-Svc header to advertise HTTP/3 with fallbacks
        add_header Alt-Svc 'h3=":443"; ma=86400, h2=":443"; ma=86400' always;

        # HTTP/3 performance headers
        add_header Vary "Accept-Encoding, Alt-Used" always;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;

        # Security headers
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # CORS headers for API
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With" always;

        # Handle preflight requests
        location / {
            if ($request_method = 'OPTIONS') {
                add_header Access-Control-Allow-Origin "*";
                add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
                add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With";
                add_header Access-Control-Max-Age 86400;
                add_header Content-Length 0;
                add_header Content-Type text/plain;
                return 204;
            }

            # Rate limiting
            limit_req zone=api burst=20 nodelay;
            limit_req zone=burst burst=100 nodelay;

            # Proxy to FastAPI application with HTTP/3 upstream support
            proxy_pass http://api_backend;

            # Use HTTP/3 for upstream when available, fallback to HTTP/2
            proxy_http_version 3.0;
            proxy_http2_push_preload on;

            # Connection upgrade support for WebSocket fallback
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # Standard proxy headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            # HTTP/3 specific headers
            proxy_set_header X-Forwarded-Protocol $server_protocol;
            proxy_set_header X-QUIC-Connection-ID $quic_connection_id;

            # Timeouts
            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            # Buffering
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
            proxy_busy_buffers_size 8k;
        }

        # Health check endpoints (bypass rate limiting)
        location ~ ^/(healthz|readyz)$ {
            proxy_pass http://api_backend;
            proxy_http_version 3.0;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Protocol $server_protocol;

            # No rate limiting for health checks
            access_log off;

            # Quick timeouts for health checks
            proxy_connect_timeout 2s;
            proxy_send_timeout 5s;
            proxy_read_timeout 5s;
        }

        # Metrics endpoint (internal only)
        location /metrics {
            # Restrict to internal networks
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            allow 127.0.0.0/8;
            deny all;

            proxy_pass http://api_backend;
            proxy_http_version 3.0;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Protocol $server_protocol;

            # No caching for metrics
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;
        }
    }

    # HTTP redirect server
    server {
        listen 80;
        server_name _;

        # Redirect all HTTP traffic to HTTPS
        return 301 https://$host$request_uri;
    }
}
